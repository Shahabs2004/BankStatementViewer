name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '0'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore BankStatementViewer.csproj --verbosity minimal -p:InvariantGlobalization=false

      - name: Build Release
        run: dotnet build BankStatementViewer.csproj --configuration Release --no-restore --verbosity minimal -p:InvariantGlobalization=false

      # ============ LIGHT VERSION ============
      - name: Publish Light Version (Framework-Dependent)
        run: dotnet publish BankStatementViewer.csproj -c Release -o publish-light -f net8.0-windows --no-self-contained -p:InvariantGlobalization=false -p:DebugType=none -p:DebugSymbols=false -v minimal

      # ============ FULL VERSION ============
      - name: Publish Full Version (Self-Contained)
        run: dotnet publish BankStatementViewer.csproj -c Release -o publish-full --self-contained -r win-x64 -p:PublishReadyToRun=true -p:InvariantGlobalization=false -p:DebugType=none -p:DebugSymbols=false -v minimal

      # Keep only English and Persian satellite culture folders. Culture directories are
      # identified through .NET CultureInfo, so directories such as runtimes/win-x64 are safe.
      # The SatelliteResourceLanguages project property filters satellite assemblies at build time;
      # this cleanup catches additional culture folders supplied by the self-contained runtime.
      - name: Keep only English and Persian culture folders and verify runtime
        shell: pwsh
        run: |
          $knownCultureNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($culture in [System.Globalization.CultureInfo]::GetCultures([System.Globalization.CultureTypes]::AllCultures)) {
            if (-not [string]::IsNullOrWhiteSpace($culture.Name)) {
              [void]$knownCultureNames.Add($culture.Name)
            }
          }

          $isEnglishOrPersian = { param([string]$name) $name -match '^(?i:en|fa)(-|$)' }
          foreach ($publishPath in @('publish-light', 'publish-full')) {
            if (-not (Test-Path $publishPath)) {
              throw "Publish directory does not exist: $publishPath"
            }

            $cultureDirs = @(Get-ChildItem -Path $publishPath -Directory -Recurse -Force |
              Where-Object {
                $knownCultureNames.Contains($_.Name) -and -not (& $isEnglishOrPersian $_.Name)
              } |
              Sort-Object { $_.FullName.Length } -Descending)

            foreach ($dir in $cultureDirs) {
              if (Test-Path -LiteralPath $dir.FullName) {
                Remove-Item -LiteralPath $dir.FullName -Recurse -Force
                Write-Host "Removed non-English/non-Persian culture folder: $($dir.FullName)"
              }
            }
          }

          $publishPath = 'publish-full'
          $requiredFiles = @(
            'BankStatementViewer.exe',
            'BankStatementViewer.runtimeconfig.json',
            'coreclr.dll',
            'hostfxr.dll',
            'hostpolicy.dll',
            'System.Private.CoreLib.dll'
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $publishPath $file))) {
              throw "Required self-contained runtime file is missing: $file"
            }
          }

          $runtimeConfigPath = Join-Path $publishPath 'BankStatementViewer.runtimeconfig.json'
          $runtimeConfig = Get-Content $runtimeConfigPath -Raw | ConvertFrom-Json
          $configProperties = $runtimeConfig.runtimeOptions.configProperties
          $invariant = $null
          if ($null -ne $configProperties) {
            $invariant = $configProperties.'System.Globalization.Invariant'
          }
          if ($invariant -eq $true -or "$invariant" -eq 'true') {
            throw 'Invariant globalization is enabled in the published runtimeconfig. WPF startup may fail while resolving en-US/fa-IR culture.'
          }

          $remaining = @(Get-ChildItem -Path $publishPath -Directory -Recurse -Force |
            Where-Object {
              $knownCultureNames.Contains($_.Name) -and -not (& $isEnglishOrPersian $_.Name)
            })
          if ($remaining.Count -gt 0) {
            $remaining | ForEach-Object { Write-Host "Unexpected culture folder: $($_.FullName)" }
            throw 'One or more non-English/non-Persian culture folders remain.'
          }

          Write-Host 'Runtime files verified. Globalization is not invariant.'
          Write-Host 'Only English and Persian culture folders remain; runtimes and other non-culture folders were preserved.'

      - name: Create Light Version ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref }}".Replace('refs/tags/', '')
          Compress-Archive -Path publish-light/* -DestinationPath "BankStatementViewer-$version-light-win-x64.zip" -Force

      - name: Create Full Version ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref }}".Replace('refs/tags/', '')
          Compress-Archive -Path publish-full/* -DestinationPath "BankStatementViewer-$version-full-win-x64.zip" -Force

      - name: Get File Sizes
        id: sizes
        shell: pwsh
        run: |
          $light = Get-ChildItem "BankStatementViewer-*-light-win-x64.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          $full = Get-ChildItem "BankStatementViewer-*-full-win-x64.zip" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($light) { $lightSize = "$([Math]::Round($light.Length / 1MB, 2)) MB" } else { $lightSize = 'N/A' }
          if ($full) { $fullSize = "$([Math]::Round($full.Length / 1MB, 2)) MB" } else { $fullSize = 'N/A' }

          "LIGHT_SIZE=$lightSize" >> $env:GITHUB_OUTPUT
          "FULL_SIZE=$fullSize" >> $env:GITHUB_OUTPUT

      - name: Get Release Notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref }}".Replace('refs/tags/', '')
          $notes = git tag -l --format='%(contents)' $tag
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release $tag" }
          $delimiter = "NOTES_$([Guid]::NewGuid().ToString('N'))"
          "NOTES<<$delimiter" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            BankStatementViewer-*-light-win-x64.zip
            BankStatementViewer-*-full-win-x64.zip
          body: |
            ${{ steps.notes.outputs.NOTES }}

            ## Download Options

            ### Light Version (Framework-Dependent)
            - Size: ${{ steps.sizes.outputs.LIGHT_SIZE }}
            - Requires the .NET 8 Desktop Runtime.
            - Best for computers that already have .NET 8 installed.

            ### Full Version (Self-Contained)
            - Size: ${{ steps.sizes.outputs.FULL_SIZE }}
            - Includes the .NET runtime.
            - Extract and run `BankStatementViewer.exe`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
