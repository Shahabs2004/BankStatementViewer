name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '0'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME
            if ($version -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Tag '$version' is invalid. Use the three-part format vMAJOR.MINOR.PATCH (for example v1.1.1)."
            }
          }
          else {
            $latestTag = git tag --list 'v[0-9]*' --sort=-version:refname | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($latestTag)) {
              $latestTag = 'v1.0.0'
            }

            if ($latestTag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              throw "Latest tag '$latestTag' is not a three-part version."
            }

            $version = "v$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          }

          "TAG=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore BankStatementViewer.csproj --verbosity minimal -p:InvariantGlobalization=false

      - name: Build Release
        run: dotnet build BankStatementViewer.csproj --configuration Release --no-restore --verbosity minimal -p:InvariantGlobalization=false

      - name: Publish Light Version (Framework-Dependent)
        run: dotnet publish BankStatementViewer.csproj -c Release -o publish-light -f net8.0-windows --no-self-contained -p:InvariantGlobalization=false -p:DebugType=none -p:DebugSymbols=false -v minimal

      - name: Publish Full Version (Self-Contained)
        run: dotnet publish BankStatementViewer.csproj -c Release -o publish-full -f net8.0-windows -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:InvariantGlobalization=false -p:DebugType=none -p:DebugSymbols=false -v minimal

      - name: Keep only English and Persian culture folders and verify runtime
        shell: pwsh
        run: |
          $knownCultureNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($culture in [System.Globalization.CultureInfo]::GetCultures([System.Globalization.CultureTypes]::AllCultures)) {
            if (-not [string]::IsNullOrWhiteSpace($culture.Name)) {
              [void]$knownCultureNames.Add($culture.Name)
            }
          }

          foreach ($publishPath in @('publish-light', 'publish-full')) {
            if (-not (Test-Path $publishPath)) {
              throw "Publish directory does not exist: $publishPath"
            }

            $cultureDirs = @(Get-ChildItem -Path $publishPath -Directory -Recurse -Force |
              Where-Object {
                $knownCultureNames.Contains($_.Name) -and $_.Name -notmatch '^(?i:en|fa)(-|$)'
              } |
              Sort-Object { $_.FullName.Length } -Descending)

            foreach ($dir in $cultureDirs) {
              if (Test-Path -LiteralPath $dir.FullName) {
                Remove-Item -LiteralPath $dir.FullName -Recurse -Force
                Write-Host "Removed culture folder: $($dir.FullName)"
              }
            }
          }

          $requiredFiles = @(
            'BankStatementViewer.exe',
            'BankStatementViewer.runtimeconfig.json',
            'coreclr.dll',
            'hostfxr.dll',
            'hostpolicy.dll',
            'System.Private.CoreLib.dll'
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path 'publish-full' $file))) {
              throw "Required self-contained runtime file is missing: $file"
            }
          }

          $runtimeConfig = Get-Content 'publish-full/BankStatementViewer.runtimeconfig.json' -Raw | ConvertFrom-Json
          $invariant = $runtimeConfig.runtimeOptions.configProperties.'System.Globalization.Invariant'
          if ($invariant -eq $true -or "$invariant" -eq 'true') {
            throw 'Invariant globalization is enabled. The application requires normal globalization support.'
          }

          Write-Host 'Self-contained runtime verified; globalization is not invariant.'

      - name: Create Light Version ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.TAG }}"
          Compress-Archive -Path publish-light/* -DestinationPath "BankStatementViewer-$version-light-win-x64.zip" -Force

      - name: Create Full Version ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.TAG }}"
          Compress-Archive -Path publish-full/* -DestinationPath "BankStatementViewer-$version-full-win-x64.zip" -Force

      - name: Get File Sizes
        id: sizes
        shell: pwsh
        run: |
          $light = Get-ChildItem "BankStatementViewer-*-light-win-x64.zip" | Select-Object -First 1
          $full = Get-ChildItem "BankStatementViewer-*-full-win-x64.zip" | Select-Object -First 1
          $lightSize = "$([Math]::Round($light.Length / 1MB, 2)) MB"
          $fullSize = "$([Math]::Round($full.Length / 1MB, 2)) MB"
          "LIGHT_SIZE=$lightSize" >> $env:GITHUB_OUTPUT
          "FULL_SIZE=$fullSize" >> $env:GITHUB_OUTPUT

      - name: Get Release Notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          $notes = git tag -l --format='%(contents)' $tag
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = git log -1 --pretty=%B
          }
          $delimiter = "NOTES_$([Guid]::NewGuid().ToString('N'))"
          "NOTES<<$delimiter" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          files: |
            BankStatementViewer-*-light-win-x64.zip
            BankStatementViewer-*-full-win-x64.zip
          body: |
            ${{ steps.notes.outputs.NOTES }}

            ## Download Options

            ### Light Version (Framework-Dependent)
            - Size: ${{ steps.sizes.outputs.LIGHT_SIZE }}
            - Requires the .NET 8 Desktop Runtime.
            - Best for computers that already have .NET 8 installed.

            ### Full Version (Self-Contained)
            - Size: ${{ steps.sizes.outputs.FULL_SIZE }}
            - Includes the .NET runtime.
            - Extract and run `BankStatementViewer.exe`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
